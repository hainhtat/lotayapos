# Lotaya ERP — lotaya.mmds.site only.
# Do not copy this file over pos.mmds.site, snmd, delilist, or other vhosts.
server {
    listen 80;
    listen [::]:80;
    server_name lotaya.mmds.site;
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name lotaya.mmds.site;

    ssl_certificate /etc/letsencrypt/live/lotaya.mmds.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lotaya.mmds.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    root /opt/lotaya/current/frontend/dist;
    index index.html;

    client_max_body_size 12m;

    location /api/ {
        proxy_pass http://127.0.0.1:4010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location = /app { return 308 /app/; }

    location = /app/ {
        alias /opt/lotaya/current/app/index.html;
        add_header Cache-Control "no-cache" always;
    }

    location = /app/version.json {
        alias /opt/lotaya/current/app/version.json;
        default_type application/json;
        add_header Cache-Control "no-store" always;
    }

    location = /app/lotaya-rider.apk {
        alias /opt/lotaya/current/app/lotaya-rider.apk;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="lotaya-rider.apk"' always;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
    }

    location ^~ /app/ {
        alias /opt/lotaya/current/app/;
        types {
            application/vnd.android.package-archive apk;
            application/json json;
        }
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
